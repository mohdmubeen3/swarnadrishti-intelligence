<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#0D111A"/>
  <rect x="1" y="1" width="46" height="46" rx="9" stroke="#1E293B" stroke-width="2"/>
  <!-- Gold and cyan intersecting curves representing relative-value pricing -->
  <path d="M 8 36 C 18 36, 22 14, 40 12" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 8 16 C 20 18, 26 34, 40 32" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Intersect point indicating statistical convergence / fair value intersection -->
  <circle cx="23.5" cy="24" r="3.5" fill="#00E5FF" fill-opacity="0.2"/>
  <circle cx="23.5" cy="24" r="2" fill="#FFFFFF"/>
</svg>
